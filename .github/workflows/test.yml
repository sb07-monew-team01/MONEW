name: CI - Test

on:
  push:
    branches:
      - dev  # dev에 merge/push 될 때만 뱃지 파일을 실제로 커밋함
#  pull_request:
#    branches:
#      - dev  # PR 시에는 테스트만 수행하고 뱃지 커밋은 건너뜀

jobs:
  test:
    runs-on: ubuntu-latest
    # [중요] 토큰 없이 레포지토리에 파일을 쓰기 위한 권한 설정
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and Test with Gradle
        # jacocoTestReport가 실행되어야 build/reports/jacoco/test/ 경로에 리포트가 생성됨
        run: ./gradlew test jacocoTestReport

      # Step 1: JaCoCo 리포트(CSV)를 읽어서 SVG 뱃지 이미지 생성
      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-branches-badge: true

      # 자동 브랜치 생성 + PR 생성
      - name: Create Pull Request with badge
        if: github.ref == 'refs/heads/dev'  # dev 브랜치에 merge/push 이벤트일 때만
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update coverage badge [skip ci]'
          branch: "update-badge-${{ github.run_id }}"  # 자동으로 브랜치 생성
          title: "Update JaCoCo coverage badge"
          body: "Automated PR to update coverage badge"
          base: dev
          path: ".github/badges/*.svg"
#
      # Step 2: 생성된 뱃지 파일을 레포지토리에 자동 커밋 및 푸시
#      # push 이벤트일 때만 동작하도록 설정 (PR 시 불필요한 커밋 방지)
#      - name: Commit and push the badge
#        # if: github.event_name == 'push'
#        # dev 브랜치가 갱신될 때
#        if: github.ref == 'refs/heads/dev'
