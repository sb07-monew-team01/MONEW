name: CI - Test

on:
  push:
    branches:
      - dev  # dev에 merge/push 될 때만 뱃지 파일을 실제로 커밋함
  pull_request:
    branches:
      - dev  # PR 시에는 테스트만 수행하고 뱃지 커밋은 건너뜀

jobs:
  test:
    runs-on: ubuntu-latest
    # [중요] 토큰 없이 레포지토리에 파일을 쓰기 위한 권한 설정
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and Test with Gradle
        # jacocoTestReport가 실행되어야 build/reports/jacoco/test/ 경로에 리포트가 생성됨
        run: ./gradlew test jacocoTestReport