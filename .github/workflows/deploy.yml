name: Deploy to EC2 (2)

# feat/common/deploy 브랜치에 push되면 실행
on:
  push:
    branches:
      - feat/common/deploy22

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 환경 변수 설정 (GitHub Secrets에서 가져오기)
      - name: Set environment variables
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: echo "환경 변수 로딩 완료"

      # 3. EC2에 배포 (ssh를 통해 Docker Compose 실행)
      - name: Deploy to EC2 (2)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }} # GitHub Secrets에 PEM 파일 내용(base64 가능)
          EC2_USER: ubuntu
          EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          echo "$SSH_KEY" > my-key.pem
          chmod 600 my-key.pem
          ssh -o StrictHostKeyChecking=no -i my-key.pem $EC2_USER@$EC2_HOST "
            # 1. Git 리포지토리 설정 (처음이면 clone, 아니면 pull)
            if [ ! -d '/home/ubuntu/monew-hyo37/.git' ]; then
              echo '리포지토리를 처음 설치합니다...'
              rm -rf /home/ubuntu/monew-hyo37
              git clone https://github.com/sb07-monew-team01/MONEW.git /home/ubuntu/monew-hyo37
            fi

            cd /home/ubuntu/monew-hyo37
            git fetch origin
            git checkout feat/common/deploy22
            git pull origin feat/common/deploy22

            # 2. 환경 변수 파일 생성 (.env)
            cat > .env << 'ENVEOF'
SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
AWS_REGION=${{ secrets.AWS_REGION }}
ENVEOF

            # 3. Docker Compose로 배포
            docker-compose -f docker-compose.prod.yml up -d --build
          "